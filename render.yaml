databases:
  - name: pop-db
    plan: basic-256mb
    databaseName: pop
    user: pop

services:
  - type: web
    name: pop
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pop-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22.17.0
